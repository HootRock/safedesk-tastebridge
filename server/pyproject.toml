[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathon-projects"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "tzdata>=2025"]

[project.optional-dependencies]
remote = ["libsql==0.1.11"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: explicitly enabled real service integration"]
testpaths = ["tests"]
